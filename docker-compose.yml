services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: casebattle
      POSTGRES_PASSWORD: casebattle
      POSTGRES_DB: casebattle
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
