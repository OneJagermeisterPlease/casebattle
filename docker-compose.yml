# Продакшен-запуск на своём сервере: docker compose up -d --build
services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      DATABASE_URL: file:/data/casebattle.db
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost}
    volumes:
      - data:/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web, api]

volumes:
  data:
  caddy:
