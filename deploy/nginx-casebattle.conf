# Сайт CaseClash за Xray: Xray принимает 443 и отдаёт не-VPN TLS-трафик в nginx через unix-сокет
# с proxy_protocol. Подключается строкой `include /etc/nginx/casebattle.conf;` в блоке http.
server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:4010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
